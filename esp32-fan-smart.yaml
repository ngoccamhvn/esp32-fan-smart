substitutions:
  fw_version: "1.0.7" 
  github_user: "ngoccamhvn" 
  github_repo: "esp32_fan_smart" 

esphome:
  name: esp32-fan-smart 
  friendly_name: quatthongminh
  comment: "Firmware ${fw_version}"
  project:
    name: ngoccamhvn.esp32_fan_smart
    version: ${fw_version}

# SỬA LẠI ĐOẠN NÀY Ở ĐẦU FILE (KHOẢNG DÒNG 21)
esp32:
  board: esp32dev # Đổi từ upesy_wroom sang esp32dev để sửa triệt để lỗi lệch ô nhớ boot
  variant: esp32
  framework:
    type: arduino


api:


ota:
  - platform: esphome


web_server:
  port: 80
  version: 3
  auth:
    username: "admin"
    password: "12345678"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "esp32 Fallback Hotspot"
    password: "12345678"

captive_portal:

logger:
  baud_rate: 0
  level: INFO

# KÍCH HOẠT THÀNH PHẦN MẠNG GỐC CỦA ESPHOME (Tắt SSL để chạy mượt trên Arduino)
http_request:
  useragent: esphome-device
  timeout: 10s
  verify_ssl: false

# CÁC BIẾN TOÀN CỤC LƯU TRỮ TRẠNG THÁI
globals:
  - id: has_new_fw
    type: bool
    initial_value: 'false'
  - id: learning_mode
    type: int
    initial_value: '0' 
  - id: ir_num_power
    type: uint32_t
    initial_value: '0'
  - id: ir_num_cycle
    type: uint32_t
    initial_value: '0'
  - id: ir_num_speed1
    type: uint32_t
    initial_value: '0'
  - id: ir_num_speed2
    type: uint32_t
    initial_value: '0'
  - id: ir_num_speed3
    type: uint32_t
    initial_value: '0'
  - id: ir_num_swing
    type: uint32_t
    initial_value: '0'

text_sensor:
  - platform: template
    name: "Latest Version Available"
    id: latest_version
    icon: "mdi:github"

  - platform: template
    name: "Trạng thái học lệnh IR"
    id: text_learning_status
    lambda: |-
      return {"Chế độ thường"};


# ==============================================================================
# BỘ THU HỒNG NGOẠI MÃ HÓA TOÀN CHUỖI SỬ DỤNG MURMURHASH VẠN NĂNG (GPIO12)
# ==============================================================================
remote_receiver:
  pin: 
    number: GPIO12
    mode: INPUT_PULLUP
  dump: raw
  filter: 40us
  idle: 30ms
  on_raw:
    - lambda: |-
        if (x.empty() || x.size() < 8) return;

        // Thuật toán băm mã hóa toàn chuỗi xung thông minh (MurmurHash3)
        uint32_t hash = 0x811C9DC5; 
        for (auto item : x) {
          int normalized_pulse = (std::abs(item) / 150) * 150;
          if (item < 0) normalized_pulse = -normalized_pulse; 
          hash ^= (uint32_t)normalized_pulse;
          hash *= 0x01000193; 
        }

        // 1. NẾU ĐANG Ở CHẾ ĐỘ HỌC LỆNH -> Lưu mã vào bộ nhớ Flash
        if (id(learning_mode) > 0) {
          if (id(learning_mode) == 1) { id(ir_num_power) = hash; id(text_learning_status).publish_state("Đã học xong: TẮT BẬT"); }
          else if (id(learning_mode) == 2) { id(ir_num_cycle) = hash; id(text_learning_status).publish_state("Đã học xong: CHUYỂN TỐC ĐỘ"); }
          else if (id(learning_mode) == 3) { id(ir_num_speed1) = hash; id(text_learning_status).publish_state("Đã học xong: TỐC ĐỘ 1"); }
          else if (id(learning_mode) == 4) { id(ir_num_speed2) = hash; id(text_learning_status).publish_state("Đã học xong: TỐC ĐỘ 2"); }
          else if (id(learning_mode) == 5) { id(ir_num_speed3) = hash; id(text_learning_status).publish_state("Đã học xong: TỐC ĐỘ 3"); }
          else if (id(learning_mode) == 6) { id(ir_num_swing) = hash; id(text_learning_status).publish_state("Đã học xong: ĐẢO GIÓ"); }
          return;
        }

        // Kiểm tra thời gian thực trạng thái quạt có đang bật chạy số nào hay không
        bool is_fan_active = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;

        // 2. NẾU Ở CHẾ ĐỘ CHẠY THƯỜNG -> Thực thi điều khiển khiển Remote từ xa khi gạt ON
        if (hash == id(ir_num_power)) {
          if (id(condition_mode_switch).state) id(virtual_power_button).press();
        }
        else if (hash == id(ir_num_cycle)) {
          if (id(condition_mode_switch).state && is_fan_active) id(virtual_cycle_button).press();
        }
        else if (hash == id(ir_num_speed1)) {
          if (id(condition_mode_switch).state && is_fan_active) id(relay_toc_do_1).turn_on();
        }
        else if (hash == id(ir_num_speed2)) {
          if (id(condition_mode_switch).state && is_fan_active) id(relay_toc_do_2).turn_on();
        }
        else if (hash == id(ir_num_speed3)) {
          if (id(condition_mode_switch).state && is_fan_active) id(relay_toc_do_3).turn_on();
        }
        else if (hash == id(ir_num_swing)) {
          // VÁ LỖI LOGIC: Ép Công tắc chế độ phải đang ON và quạt đang chạy thì phím đảo gió hồng ngoại mới có tác dụng
          if (id(condition_mode_switch).state && is_fan_active) {
            id(virtual_swing_switch).toggle();
          }
        }

# ==============================================================================
# CẤU HÌNH CỤM NÚT BẤM VẬT LÝ ESP32 (ĐỒNG BỘ ĐẤU CHUNG CHÂN MASS 0V/GND)
# ==============================================================================
binary_sensor:
  - platform: status
    id: esphome_device_status

  # GPIO33: Nút bấm vật lý học lệnh hồng ngoại
  - platform: gpio
    id: button_learning_33
    pin: { number: GPIO33, mode: INPUT_PULLUP, inverted: true }
    name: "Nút bấm - Học Lệnh Hồng Ngoại"
    on_click:
      - min_length: 3000ms
        max_length: 10000ms
        then:
          - button.press: virtual_trigger_learn_start
      - max_length: 2000ms
        then:
          - button.press: virtual_trigger_learn_next

  # GPIO13: Công tắc gạt chuyển đổi chế độ phân quyền điều khiển
  - platform: gpio
    id: condition_mode_switch
    pin: { number: GPIO13, mode: INPUT_PULLUP, inverted: true }
    name: "Trạng thái Công tắc Chế độ"
    on_press:
      - lambda: |-
          id(relay_toc_do_1).turn_off(); delay(10); id(relay_toc_do_2).turn_off(); delay(10);
          id(relay_toc_do_3).turn_off(); delay(10); id(relay_dao_huong).turn_off();

  # GPIO14: ĐA NHIỆM 1
  - platform: gpio
    id: button_multi_14
    pin: { number: GPIO14, mode: INPUT_PULLUP, inverted: true }
    name: "Nút bấm quạt - Số 1 (ON-OFF)"
    filters: [ delayed_on: 50ms ]
    on_press:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_1).turn_on();
          else id(virtual_power_button).press();
    on_release:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_1).turn_off();

  # GPIO27: ĐA NHIỆM 2
  - platform: gpio
    id: button_multi_27
    pin: { number: GPIO27, mode: INPUT_PULLUP, inverted: true }
    name: "Nút bấm quạt - Số 2 (Nút chuyển tốc độ)"
    filters: [ delayed_on: 50ms ]
    on_press:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_2).turn_on();
          else id(virtual_cycle_button).press();
    on_release:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_2).turn_off();

  # GPIO26: Công tắc tốc độ số 3 (Chỉ hoạt động khi Chế độ OFF)
  - platform: gpio
    id: button_so_26
    pin: { number: GPIO26, mode: INPUT_PULLUP, inverted: true }
    name: "Nút bấm quạt - Số 3"
    on_press:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_3).turn_on();
    on_release:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_3).turn_off();

  # GPIO25: Nút bấm cơ điều khiển đảo hướng gió
  - platform: gpio
    id: physical_swing_button
    pin: { number: GPIO25, mode: INPUT_PULLUP, inverted: true }
    name: "Nút Bấm Đảo Hướng Gió"
    filters: [ delayed_on: 50ms ]
    on_press:
      - lambda: |-
          bool is_fan_running = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;
          if (is_fan_running) {
            if (!id(condition_mode_switch).state) id(relay_dao_huong).turn_on();
            else id(virtual_swing_switch).toggle();
          }
    on_release:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_dao_huong).turn_off();

  # --- 4 CẢM BIẾN GIÁM SÁT TRẠNG THÁI ĐẦU RA RELAY TRÊN GIAO DIỆN HASS ---
  - platform: template
    name: "Trạng thái Relay - Số 1"
    icon: "mdi:power-plug-outline"
    lambda: |-
      return id(relay_toc_do_1).state;
  - platform: template
    name: "Trạng thái Relay - Số 2"
    icon: "mdi:power-plug-outline"
    lambda: |-
      return id(relay_toc_do_2).state;
  - platform: template
    name: "Trạng thái Relay - Số 3"
    icon: "mdi:power-plug-outline"
    lambda: |-
      return id(relay_toc_do_3).state;
  - platform: template
    name: "Trạng thái Relay - Đảo Hướng"
    icon: "mdi:power-plug-outline"
    lambda: |-
      return id(relay_dao_huong).state;
# ==============================================================================
# CẤU HÌNH CÁC RƠ-LE VẬT LÝ KÍCH MỨC THẤP (ACTIVE LOW) ĐÃ ĐỒNG BỘ 100%
# ==============================================================================
switch:
  # GPIO16: Rơ-le tốc độ số 1
  - platform: gpio
    id: relay_toc_do_1
    pin: { number: GPIO16, inverted: true }
    restore_mode: ALWAYS_OFF
    interlock: [relay_toc_do_2, relay_toc_do_3]
    on_turn_off:
      - delay: 50ms
      - lambda: |-
          bool any_running = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;
          if (!any_running) id(relay_dao_huong).turn_off();

  # GPIO17: Rơ-le tốc độ số 2
  - platform: gpio
    id: relay_toc_do_2
    pin: { number: GPIO17, inverted: true }
    restore_mode: ALWAYS_OFF
    interlock: [relay_toc_do_1, relay_toc_do_3]
    on_turn_off:
      - delay: 50ms
      - lambda: |-
          bool any_running = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;
          if (!any_running) id(relay_dao_huong).turn_off();

  # GPIO5: Rơ-le tốc độ số 3
  - platform: gpio
    id: relay_toc_do_3
    pin: { number: GPIO5, inverted: true }
    restore_mode: ALWAYS_OFF
    interlock: [relay_toc_do_1, relay_toc_do_2]
    on_turn_off:
      - delay: 50ms
      - lambda: |-
          bool any_running = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;
          if (!any_running) id(relay_dao_huong).turn_off();

  # GPIO18: Rơ-le đảo hướng gió
  - platform: gpio
    id: relay_dao_huong
    pin: { number: GPIO18, inverted: true }
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(virtual_swing_switch).publish_state(true);
    on_turn_off:
      - lambda: id(virtual_swing_switch).publish_state(false);

  # --- CÔNG TẮC ẢO ĐẢO HƯỚNG GIÓ ---
  - platform: template
    name: "Đảo Hướng Gió"
    id: virtual_swing_switch
    icon: "mdi:rotate-left-right"
    lambda: |-
      if (!id(esphome_device_status).state) return false;
      return id(relay_dao_huong).state;
    turn_on_action:
      - lambda: |-
          bool is_fan_running = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;
          if (is_fan_running) id(relay_dao_huong).turn_on();
          else id(virtual_swing_switch).publish_state(false);
    turn_off_action:
      - switch.turn_off: relay_dao_huong

  # --- 3 CÔNG TẮC ẢO CHỈNH TỐC ĐỘ ---
  - platform: template
    name: "Quạt - Tốc độ 1"
    id: hass_switch_1
    icon: "mdi:fan-speed-1"
    lambda: |-
      if (!id(esphome_device_status).state) return false;
      return id(relay_toc_do_1).state;
    turn_on_action:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_1).turn_on();
          else id(hass_switch_1).publish_state(false);
    turn_off_action:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_1).turn_off();

  - platform: template
    name: "Quạt - Tốc độ 2"
    id: hass_switch_2
    icon: "mdi:fan-speed-2"
    lambda: |-
      if (!id(esphome_device_status).state) return false;
      return id(relay_toc_do_2).state;
    turn_on_action:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_2).turn_on();
          else id(hass_switch_2).publish_state(false);
    turn_off_action:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_2).turn_off();

  - platform: template
    name: "Quạt - Tốc độ 3"
    id: hass_switch_3
    icon: "mdi:fan-speed-3"
    lambda: |-
      if (!id(esphome_device_status).state) return false;
      return id(relay_toc_do_3).state;
    turn_on_action:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_3).turn_on();
          else id(hass_switch_3).publish_state(false);
    turn_off_action:
      - lambda: |-
          if (!id(condition_mode_switch).state) id(relay_toc_do_3).turn_off();

# ==============================================================================
# CẤU HÌNH CÁC NÚT ĐIỀU KHIỂN CHỨC NĂNG VÀ HỆ THỐNG GỘP HỌC LỆNH
# ==============================================================================
button:
  # NÚT ẢO GỘP RÚT GỌN (BUTTON CHUẨN API): Click 1 phát -> Tự động hóa điều phối logic
  - platform: template
    name: "Học Lệnh IR"
    id: virtual_combined_learning_button
    icon: "mdi:remote-layers"
    on_press:
      - lambda: |-
          if (id(learning_mode) == 0) {
            id(virtual_trigger_learn_start).press(); 
          } else {
            id(virtual_trigger_learn_next).press();  
          }

  # --- LUỒNG TRUNG GIAN ĐỒNG BỘ ---
  - platform: template
    id: virtual_trigger_learn_start
    on_press:
      - lambda: |-
          if (id(learning_mode) == 0) {
            id(learning_mode) = 1;
            id(text_learning_status).publish_state("Đang học phím: TẮT BẬT");
          }
  - platform: template
    id: virtual_trigger_learn_next
    on_press:
      - lambda: |-
          if (id(learning_mode) > 0) {
            id(learning_mode)++;
            if (id(learning_mode) == 2) id(text_learning_status).publish_state("Đang học phím: CHUYỂN TỐC ĐỘ");
            else if (id(learning_mode) == 3) id(text_learning_status).publish_state("Đang học phím: TỐC ĐỘ 1");
            else if (id(learning_mode) == 4) id(text_learning_status).publish_state("Đang học phím: TỐC ĐỘ 2");
            else if (id(learning_mode) == 5) id(text_learning_status).publish_state("Đang học phím: TỐC ĐỘ 3");
            else if (id(learning_mode) == 6) id(text_learning_status).publish_state("Đang học phím: ĐẢO GIÓ");
            else { 
              id(learning_mode) = 0; 
              id(text_learning_status).publish_state("Đã thoát và Lưu lệnh thành công!"); 
            }
          }

  # Nút ảo nguồn quạt chung
  - platform: template
    name: "Nút Tắt Bật (On-Off)"
    id: virtual_power_button
    icon: "mdi:power"
    on_press:
      - lambda: |-
          if (id(condition_mode_switch).state) {
            bool is_running = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;
            if (is_running) {
              id(relay_toc_do_1).turn_off(); id(relay_toc_do_2).turn_off(); id(relay_toc_do_3).turn_off();
            } else {
              id(relay_toc_do_2).turn_on();
            }
          }

  # Nút ảo chỉnh tốc độ vòng tròn
  - platform: template
    name: "Nút Chuyển Tốc Độ"
    id: virtual_cycle_button
    icon: "mdi:fan-chevron-up"
    on_press:
      - lambda: |-
          if (id(condition_mode_switch).state) {
            bool is_running = id(relay_toc_do_1).state || id(relay_toc_do_2).state || id(relay_toc_do_3).state;
            if (is_running) {
              if (id(relay_toc_do_1).state) id(relay_toc_do_2).turn_on();
              else if (id(relay_toc_do_2).state) id(relay_toc_do_3).turn_on();
              else if (id(relay_toc_do_3).state) id(relay_toc_do_1).turn_on();
            }
          }
  - platform: template
    name: "Check Firmware Update"
    id: check_update_btn
    icon: "mdi:cloud-check"
    on_press:
      then:
        - logger.log: "Đang gọi kiểm tra phiên bản mới từ GitHub..."
        - http_request.get:
            # ĐÃ SỬA CHUẨN ĐƯỜNG DẪN API GỐC CỦA GITHUB (Thay vì đường dẫn github.com cũ)
            url: "https://github.com"
            headers:
              User-Agent: "esphome-device"
              # ĐÃ THÊM KHAI BÁO BẮT BUỘC ĐỂ GITHUB TRẢ VỀ CHUỖI JSON SẠCH
              Accept: "application/vnd.github.v3+json"
            on_response:
              then:
                - lambda: |-
                    // Tiến hành phân tích chuỗi văn bản JSON trả về từ API
                    size_t pos = body.find("\"tag_name\":\"");
                    if (pos != std::string::npos) {
                      pos += 12; 
                      size_t end_pos = body.find("\"", pos);
                      std::string new_ver = body.substr(pos, end_pos - pos);
                      
                      if (new_ver.rfind("v", 0) == 0) {
                        new_ver = new_ver.substr(1);
                      }
                      
                      // Cập nhật trạng thái hiển thị số phiên bản lên giao diện
                      id(latest_version).publish_state(new_ver);
                      
                      if (new_ver != "${fw_version}") {
                        id(has_new_fw) = true;
                        ESP_LOGI("GitHub_OTA", "Phat hien ban moi: %s. San sang cap nhat.", new_ver.c_str());
                      } else {
                        id(has_new_fw) = false;
                        ESP_LOGI("GitHub_OTA", "Firmware hien tai da la moi nhat.");
                      }
                    } else {
                      ESP_LOGE("GitHub_OTA", "Khong tim thay truong tag_name trong chuoi JSON.");
                    }
