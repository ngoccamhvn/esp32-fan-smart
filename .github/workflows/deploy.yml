name: Compile and Release ESPHome

on:
  push:
    branches:
      - main 
    paths:
      - 'esp32-fan-smart.yaml'

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up and Compile ESPHome
        id: esphome-build
        uses: esphome/build-action@v7
        with:
          yaml-file: esp32-fan-smart.yaml
          version: latest

      - name: Prepare firmware file
        run: |
          mkdir -p output_fw
          find .esphome/build/ -name "firmware.bin" -exec cp {} ./firmware.bin \;
          find .esphome/build/ -name "*ota.bin" -exec cp {} ./firmware.bin \;
          if [ ! -f ./firmware.bin ]; then
            echo "LỖI: Không tìm thấy file firmware!"
            exit 1
          fi

# SỬA LẠI ĐOẠN CUỐI FILE deploy.yml NHƯ SAU:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Thay thế cụm v${{ github.run_number }} cũ bằng biến fw_version
          tag_name: v${{ grep 'fw_version:' esp32-fan-smart.yaml | head -n1 | awk '{print $2}' | tr -d '"' }}
          name: Release v${{ grep 'fw_version:' esp32-fan-smart.yaml | head -n1 | awk '{print $2}' | tr -d '"' }}
          body: |
            Tự động biên dịch Firmware cho esp32-fan-smart thành công.
            Mã commit: ${{ github.sha }}
          files: firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
