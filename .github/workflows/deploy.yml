name: Compile and Release ESPHome

on:
  push:
    branches:
      - main 
    paths:
      - 'esp32-fan-smart.yaml'

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up and Compile ESPHome
        id: esphome-build
        uses: esphome/build-action@v7
        with:
          yaml-file: esp32-fan-smart.yaml
          version: 2024.12.2

      - name: Prepare firmware file
        run: |
          mkdir -p output_fw
          # Tự động quét và tìm file factory tổng hợp (chứa sẵn bootloader phần cứng)
          find .esphome/build/ -name "*factory.bin" -exec cp {} ./firmware-factory.bin \;
          
          if [ ! -f ./firmware-factory.bin ]; then
            echo "LỖI: Không tìm thấy file factory tổng hợp!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Tự động biên dịch Firmware tổng hợp cho esp32-fan-smart thành công.
          files: |
            firmware-factory.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
