name: Compile and Release ESPHome

on:
  push:
    branches:
      - main 
    paths:
      - 'esp32-fan-smart.yaml'

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BƯỚC MỚI: Tự động trích xuất số phiên bản từ file yaml
      - name: Get firmware version
        id: get_ver
        run: |
          VERSION=$(grep 'fw_version:' esp32-fan-smart.yaml | head -n1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "FW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Dự án đang ở phiên bản: $VERSION"

      - name: Set up and Compile ESPHome
        id: esphome-build
        uses: esphome/build-action@v7
        with:
          yaml-file: esp32-fan-smart.yaml
          version: latest

      - name: Prepare firmware file
        run: |
          mkdir -p output_fw
          find .esphome/build/ -name "firmware.bin" -exec cp {} ./firmware.bin \;
          find .esphome/build/ -name "*ota.bin" -exec cp {} ./firmware.bin \;
          if [ ! -f ./firmware.bin ]; then
            echo "LỖI: Không tìm thấy file firmware!"
            exit 1
          fi

      # BƯỚC TẠO RELEASE: Sử dụng biến môi trường đã trích xuất an toàn
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FW_VERSION }}
          name: Release v${{ env.FW_VERSION }}
          body: |
            Tự động biên dịch Firmware cho esp32-fan-smart thành công.
            Phiên bản cấu hình: v${{ env.FW_VERSION }}
            Mã commit: ${{ github.sha }}
          files: firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
